name: solid_color_fills
description: A modern, privacy-first Flutter wallpaper app for custom and curated solid colors.
publish_to: "none"
version: 2.1.0+21

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI, Layout & Icons
  fluentui_system_icons: ^1.1.273

  # Color Picking & Customization
  flutter_colorpicker: ^1.1.0

  # State Management & Preferences
  provider: ^6.1.5
  shared_preferences: ^2.5.3

  # System, Storage & Wallpaper Integration
  wallpaper_manager_plus: ^2.0.4
  path_provider: ^2.1.5
  open_filex: ^5.0.0
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  flutter_displaymode: ^0.7.0
  quick_actions: ^1.1.0
  share_plus: ^13.3.1
  flutter_windowmanager_plus: ^1.1.1
  url_launcher: ^6.3.1
  adaptive_theme: 3.7.0

  # Localization
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.6

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#000000"
  android: true
  ios: false
  web: false
  image: assets/logo.png
  android12: true

flutter_icons:
  android: "launcher_icon"
  image_path: "assets/logo.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
