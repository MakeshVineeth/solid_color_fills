<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%" style="background-color: #1e1e2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89dceb" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="575" y="40" text-anchor="middle" fill="#cdd6f4" font-size="24" font-weight="700">[Deployment] Mobile Device &amp; Distribution Infrastructure</text>
  <text x="575" y="65" text-anchor="middle" fill="#a6adc8" font-size="14">C4 Model - Level 4: Deployment Diagram</text>

  <!-- Node 1: User Mobile Device -->
  <rect x="50" y="100" width="680" height="630" rx="16" fill="#181825" stroke="#29b6f6" stroke-width="2"/>
  <text x="80" y="130" fill="#81d4fa" font-size="16" font-weight="700">📱 User Mobile Device [Android Device: API 24 - 36 (Android 16)]</text>

  <!-- Sub-Node: App Security Sandbox -->
  <rect x="80" y="150" width="620" height="350" rx="12" fill="#1e1e2e" stroke="#45475a" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="100" y="180" fill="#a6adc8" font-size="14" font-weight="600">Application Security Sandbox (Isolated UID / Private App Storage)</text>

  <!-- Container: Compiled App -->
  <g transform="translate(110, 200)" filter="url(#shadow)">
    <rect width="260" height="110" rx="10" fill="#01579b" stroke="#039be5" stroke-width="2"/>
    <text x="130" y="32" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Solid Color Fills App</text>
    <text x="130" y="52" text-anchor="middle" fill="#b3e5fc" font-size="11">[Container Instance: AOT Flutter]</text>
    <text x="130" y="75" text-anchor="middle" fill="#e1f5fe" font-size="10">High-performance arm64 binary</text>
    <text x="130" y="92" text-anchor="middle" fill="#e1f5fe" font-size="10">Ahead-Of-Time compilation</text>
  </g>

  <!-- Container: Local Preferences -->
  <g transform="translate(410, 200)" filter="url(#shadow)">
    <rect width="260" height="110" rx="10" fill="#37474f" stroke="#78909c" stroke-width="2"/>
    <text x="130" y="32" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Device Preferences</text>
    <text x="130" y="52" text-anchor="middle" fill="#b0bec5" font-size="11">[SharedPreferences XML File]</text>
    <text x="130" y="75" text-anchor="middle" fill="#eceff1" font-size="10">Private app storage</text>
    <text x="130" y="92" text-anchor="middle" fill="#eceff1" font-size="10">allowBackup="false" protected</text>
  </g>

  <!-- Container: Local PNG Cache -->
  <g transform="translate(260, 340)" filter="url(#shadow)">
    <rect width="260" height="130" rx="10" fill="#00695c" stroke="#26a69a" stroke-width="2"/>
    <text x="130" y="32" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Rendered Bitmap Cache</text>
    <text x="130" y="52" text-anchor="middle" fill="#80cbc4" font-size="11">[App Cache Directory]</text>
    <text x="130" y="78" text-anchor="middle" fill="#e0f2f1" font-size="10">Temporary lossless PNG stream</text>
    <text x="130" y="96" text-anchor="middle" fill="#e0f2f1" font-size="10">generated by CanvasImageService</text>
    <text x="130" y="114" text-anchor="middle" fill="#e0f2f1" font-size="10">for WallpaperManager ingestion</text>
  </g>

  <!-- Sub-Node: Android OS Subsystem -->
  <rect x="80" y="520" width="620" height="180" rx="12" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
  <text x="100" y="550" fill="#a6adc8" font-size="14" font-weight="600">Android OS Platform Layer (API 24 - 36)</text>

  <g transform="translate(110, 570)" filter="url(#shadow)">
    <rect width="260" height="100" rx="10" fill="#263238" stroke="#607d8b" stroke-width="2"/>
    <text x="130" y="35" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">WallpaperManager</text>
    <text x="130" y="55" text-anchor="middle" fill="#b0bec5" font-size="10">[Android System Service]</text>
    <text x="130" y="78" text-anchor="middle" fill="#cfd8dc" font-size="10">FLAG_SYSTEM | FLAG_LOCK</text>
  </g>

  <g transform="translate(410, 570)" filter="url(#shadow)">
    <rect width="260" height="100" rx="10" fill="#263238" stroke="#607d8b" stroke-width="2"/>
    <text x="130" y="35" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Window Manager</text>
    <text x="130" y="55" text-anchor="middle" fill="#b0bec5" font-size="10">[WindowCompat API 36]</text>
    <text x="130" y="78" text-anchor="middle" fill="#cfd8dc" font-size="10">shortEdges Cutout &amp; Edge-to-Edge</text>
  </g>

  <!-- Node 2: Google Play Infrastructure on Right -->
  <rect x="780" y="100" width="320" height="630" rx="16" fill="#181825" stroke="#78909c" stroke-width="2"/>
  <text x="800" y="130" fill="#b0bec5" font-size="16" font-weight="700">☁️ Google Play Infrastructure</text>

  <g transform="translate(810, 200)" filter="url(#shadow)">
    <rect width="260" height="130" rx="12" fill="#37474f" stroke="#78909c" stroke-width="2"/>
    <text x="130" y="35" text-anchor="middle" fill="#eceff1" font-size="15" font-weight="700">Play Console &amp; CDN</text>
    <text x="130" y="55" text-anchor="middle" fill="#b0bec5" font-size="11">[Distribution Network]</text>
    <text x="130" y="80" text-anchor="middle" fill="#cfd8dc" font-size="10">Serves optimized signed APK splits</text>
    <text x="130" y="98" text-anchor="middle" fill="#cfd8dc" font-size="10">based on device DPI &amp; ABI</text>
  </g>

  <g transform="translate(810, 380)" filter="url(#shadow)">
    <rect width="260" height="130" rx="12" fill="#37474f" stroke="#78909c" stroke-width="2"/>
    <text x="130" y="35" text-anchor="middle" fill="#eceff1" font-size="15" font-weight="700">Play Integrity &amp; Signing</text>
    <text x="130" y="55" text-anchor="middle" fill="#b0bec5" font-size="11">[Google Cloud HSM]</text>
    <text x="130" y="80" text-anchor="middle" fill="#cfd8dc" font-size="10">Play Feature Delivery &amp;</text>
    <text x="130" y="98" text-anchor="middle" fill="#cfd8dc" font-size="10">Play App Signing Keystore</text>
  </g>

  <!-- Arrows -->
  <path d="M 370 255 L 410 255" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 240 310 L 290 340" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 240 620 L 110 310" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 810 265 L 730 265" fill="none" stroke="#89dceb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="250" text-anchor="middle" fill="#cdd6f4" font-size="11">AAB</text>
</svg>
